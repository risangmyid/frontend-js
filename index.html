<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="navbar p-1 bg-body-tertiary border-bottom">
        <div class="container-fluid">
            <a class="btn" data-bs-toggle="offcanvas" href="#offcanvasPage">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list"
                    viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
                </svg>
            </a>
            <span class="navbar-text">Login</span>
            <span class="navbar-text small">Ruang kerja halaman</span>
        </div>
    </header>

    <main class="container-fluid d-flex flex-column flex-grow-1">
        <div class="row flex-grow-1 align-content-start align-content-lg-stretch">
            <div class="col-12 d-lg-none border-bottom p-3">
                <button class="btn btn-outline-primary" type="button" data-bs-toggle="collapse"
                    data-bs-target="#panelKiri" aria-expanded="false" aria-controls="panelKiri">
                    Buka / tutup panel kiri
                </button>
            </div>

            <aside class="col-12 col-lg-3 collapse d-lg-block bg-body-tertiary border-end" id="panelKiri"
                aria-label="Panel kiri">
                <div class="p-1">
                    <div class="d-flex justify-content-between">
                        <h2 class="h5"></h2>
                        <div>
                            <a class="btn btn-sm btn-add-child" data-bs-toggle="offcanvas" href="#offcanvasEditor"> +
                            </a>
                        </div>
                    </div>
                    <ul class="tree"></ul>
                </div>
            </aside>

            <section class="col-12 col-lg-9 p-4" aria-labelledby="judulKonten">
                <h1 class="h4" id="judulKonten">Panel kanan</h1>
                <p class="mb-0">Tempat konten utama.</p>
            </section>
        </div>
    </main>

    <div class="offcanvas offcanvas-start" data-bs-keyboard="false" tabindex="-1" id="offcanvasPage"
        aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">Page</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="list-group list-group-flush list-page mb-3"></div>
            <a class="btn btn-add-page btn-sm btn-outline-secondary"> Add New Page</a>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" data-bs-keyboard="false" tabindex="-1" id="offcanvasEditor"
        aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">Edit</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div id="editor" style="height: 500px;"></div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.11/dist/dexie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script>
        require.config({
            paths: {
                vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs'
            }
        });

        require(['vs/editor/editor.main'], function () {
            const editor = monaco.editor.create(
                document.getElementById('editor'),
                {
                    value: [
                        'const nama = "Budi";',
                        'function hello() {',
                        '    console.log("Halo " + nama);',
                        '}',
                        '',
                        'hello();'
                    ].join('\n'),
                    language: 'html',
                    // theme: 'vs-dark',
                    automaticLayout: true,
                    minimap: {
                        enabled: false
                    }
                }
            );

            // Ambil isi editor
            window.getCode = function () {
                return editor.getValue();
            };
        });
    </script>
    <script type="module" src="/src/app.js"></script>
</body>

</html>
